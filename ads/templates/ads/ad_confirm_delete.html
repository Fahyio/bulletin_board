{% extends 'base.html' %}
{% block title %}Удаление объявления{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Удаление объявления</h5>
            </div>
            <div class="card-body text-center">
                <p class="lead">Вы уверены, что хотите удалить объявление:</p>
                <h5 class="text-danger">«{{ ad.title }}»</h5>
                <p class="text-muted">Это действие нельзя отменить</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">
                        <i class="bi bi-trash me-1"></i>Да, удалить
                    </button>
                    <a href="{{ ad.get_absolute_url }}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
